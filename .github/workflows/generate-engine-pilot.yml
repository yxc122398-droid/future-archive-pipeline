name: Generate Engine Pilot Narration

on:
  push:
    branches: [ main ]
    paths:
      - 'generate_engine_pilot.py'
      - '.github/workflows/generate-engine-pilot.yml'
  workflow_dispatch:

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg and packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts pydub
      - name: Generate narration
        run: python generate_engine_pilot.py
      - name: Inspect output
        run: |
          ls -lh output_engine_pilot
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 output_engine_pilot/*.mp3
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-pilot-narration
          path: output_engine_pilot/
          if-no-files-found: error
          retention-days: 30
