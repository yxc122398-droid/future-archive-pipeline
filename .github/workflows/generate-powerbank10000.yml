name: Generate Powerbank10000 Narration
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'generate_powerbank10000.py'
      - '.github/workflows/generate-powerbank10000.yml'
  workflow_dispatch:
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts pydub
      - name: Generate narration
        run: python generate_powerbank10000.py
      - name: Inspect output
        run: |
          ls -lh output_powerbank10000
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 output_powerbank10000/powerbank10000_narration.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: powerbank10000-narration
          path: output_powerbank10000/
          retention-days: 30
