name: Generate WiFi Fullbars Narration

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'generate_wifi_fullbars.py'
      - '.github/workflows/generate-wifi-fullbars.yml'
  workflow_dispatch:

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts pydub
      - name: Generate narration
        run: python generate_wifi_fullbars.py
      - name: Inspect output
        run: |
          ls -lh output_wifi_fullbars
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 output_wifi_fullbars/wifi_fullbars_narration.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-fullbars-narration
          path: output_wifi_fullbars/
          if-no-files-found: error
          retention-days: 30
