name: Generate RAM Extension Narration

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'generate_ram_extension.py'
      - '.github/workflows/generate-ram-extension.yml'
  workflow_dispatch:

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install edge-tts pydub
      - name: Generate narration
        run: python generate_ram_extension.py
      - name: Inspect output
        run: |
          ls -lh output_ram_extension
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "output_ram_extension/8GB加8GB扩展内存_旁白.mp3"
      - uses: actions/upload-artifact@v4
        with:
          name: ram-extension-narration
          path: output_ram_extension/
          if-no-files-found: error
          retention-days: 30
